@if (!store.pronto()) {
  <div class="charts-loading">
    <mat-spinner diameter="32" />
    <span>Carregando gráficos...</span>
  </div>
} @else {
<div class="charts-grid">
  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title>Valor por forma de pagamento</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <apx-chart
        [series]="valorSeries()"
        [chart]="donutChart"
        [labels]="rotulos"
        [colors]="cores"
        [legend]="legendBottom"
        [tooltip]="tooltipMoeda"
        [dataLabels]="dataLabelsOff"
        [noData]="noData"
      />
    </mat-card-content>
  </mat-card>

  <mat-card class="chart-card">
    <mat-card-header>
      <mat-card-title>Quantidade de despesas por forma de pagamento</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <apx-chart
        [series]="quantidadeSeries()"
        [chart]="barChart"
        [xaxis]="xaxisFormas"
        [yaxis]="yaxisComTexto"
        [colors]="cores"
        [plotOptions]="plotOptionsBar"
        [dataLabels]="dataLabelsOff"
        [tooltip]="tooltipQuantidade"
        [legend]="legendHidden"
        [noData]="noData"
      />
    </mat-card-content>
  </mat-card>

  <mat-card class="chart-card chart-card-wide">
    <mat-card-header>
      <mat-card-title>Distribuição do parcelamento no crédito</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <apx-chart
        [series]="parcelamentoSeries()"
        [chart]="barChart"
        [xaxis]="xaxisParcelamento()"
        [yaxis]="yaxisComTexto"
        [colors]="cores"
        [plotOptions]="plotOptionsBar"
        [dataLabels]="dataLabelsOff"
        [tooltip]="tooltipQuantidade"
        [legend]="legendHidden"
        [noData]="noData"
      />
    </mat-card-content>
  </mat-card>
</div>
}
