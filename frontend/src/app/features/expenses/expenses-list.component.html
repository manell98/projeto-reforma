<div class="page-header">
  <div>
    <h1>Despesas</h1>
    <p class="page-subtitle">Cadastre, edite e acompanhe os gastos da reforma</p>
  </div>
  <button mat-flat-button color="primary" (click)="novaDespesa()">
    <mat-icon>add</mat-icon>
    Adicionar despesa
  </button>
</div>

<mat-card class="total-card">
  <mat-card-content class="total-content">
    <span class="icon-badge success">
      <mat-icon>payments</mat-icon>
    </span>
    <div class="metric">
      <span class="metric-label"
        >Total gasto{{ temFiltrosAtivos() ? ' (com filtros aplicados)' : '' }}</span
      >
      <span class="metric-value is-hero">{{
        totalFiltrado() | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR'
      }}</span>
    </div>
  </mat-card-content>
</mat-card>

<app-expense-filters
  [categorias]="store.categorias()"
  [filtrosAtivos]="temFiltrosAtivos()"
  (filtrar)="aplicarFiltros($event)"
  (limpar)="limparFiltros()"
/>

<app-expense-table
  [despesas]="despesasFiltradas()"
  [filtrosAtivos]="temFiltrosAtivos()"
/>
